name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Triggered by: ./scripts/release.ps1 -NewVersion x.y.z -Push

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(python -c "import sys; sys.path.insert(0, 'src'); from colectica_mcp.__version__ import __version__; print(__version__)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Package version: $PKG_VERSION"
          echo "Tag version:     $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: version mismatch — __version__.py=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
